---
# Non-secret defaults. Override via -e, vars files, or Ansible Vault.

# OpenShift release version (exact or z-stream, e.g. 4.16.30)
ocp_version: ""

# Cluster topology: sno | ha | compact
cluster_type: ha

# Cloud platform: aws | azure (implemented) | gcp (roadmap stub)
platform: aws

# Provisioning method: ipi (implemented) | upi (roadmap stub)
provisioner: ipi

# Node CPU architecture for cloud VMs: x86_64 (default) | arm64
# Shared by AWS and Azure. aws_architecture remains a supported alias in code.
cluster_architecture: x86_64

# Cluster identity
cluster_name: ""
base_domain: ""

# Work directory for install-config, metadata, and auth (kubeconfig)
# Default: ./clusters/<cluster_name>
cluster_dir: ""

# Credential / secret file paths (do not commit the files themselves)
pull_secret_file: ""
ssh_public_key_file: "~/.ssh/id_rsa.pub"

# AWS
aws_region: eu-west-1
aws_profile: ""
# Prefer env AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY, or aws_profile above
aws_control_plane_instance_type: ""
aws_compute_instance_type: ""
# AWS credentials mode for install-config: auto | Passthrough | Manual | Mint
# auto (default): SSO -> Passthrough; ~/.aws/credentials or env keys -> Mint
aws_credentials_mode: auto

# Azure (service principal; env aliases: CLIENT_ID, PASSWORD, TENANT, SUBSCRIPTION, RESOURCEGROUP, GUID)
azure_region: eastus
azure_cloud_name: AzurePublicCloud
azure_outbound_type: Loadbalancer
azure_client_id: ""
azure_client_secret: ""
azure_tenant_id: ""
azure_subscription_id: ""
azure_resource_group: ""
# RG containing the public DNS zone for base_domain (defaults to azure_resource_group / RESOURCEGROUP)
azure_base_domain_resource_group: ""
# Optional: EMPTY RG in azure_region for cluster resources. Leave empty to let the installer create one.
# Do not set this to the OpenEnv/DNS RG (installer requires empty RG in the target region).
azure_cluster_resource_group: ""
azure_guid: ""
azure_control_plane_instance_type: ""
azure_compute_instance_type: ""

# Release payload for openshift-install. Empty = derive from cluster_architecture.
# Example: quay.io/openshift-release-dev/ocp-release:4.22.6-x86_64
openshift_release_image: ""

# Installer binary cache
installer_cache_dir: "{{ lookup('env', 'HOME') }}/.cache/ocp-cluster-lifecycle"

# Topology replica map (overridable)
cluster_topology:
  sno:
    control_plane_replicas: 1
    compute_replicas: 0
  compact:
    control_plane_replicas: 3
    compute_replicas: 0
  ha:
    control_plane_replicas: 3
    compute_replicas: 2
