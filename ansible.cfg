[defaults]
inventory = inventory/localhost.yml
roles_path = roles
host_key_checking = False
retry_files_enabled = False
# Use built-in default callback with YAML result formatting
# (community.general.yaml was removed in community.general 12.0.0)
callback_result_format = yaml
interpreter_python = auto_silent
gathering = smart

[privilege_escalation]
become = False
