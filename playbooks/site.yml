---
# Shared lifecycle play. Prefer playbooks/deploy.yml or playbooks/destroy.yml.
# ocp_lifecycle is set by those entrypoints (do NOT put it in your -e vars file).
- name: OpenShift cluster lifecycle
  hosts: localhost
  gather_facts: true
  pre_tasks:
    - name: Validate ocp_lifecycle
      ansible.builtin.assert:
        that:
          - ocp_lifecycle is defined
          - ocp_lifecycle in ['deploy', 'destroy']
        fail_msg: >-
          ocp_lifecycle must be 'deploy' or 'destroy'.
          Use playbooks/deploy.yml or playbooks/destroy.yml (do not set this in your vars file).

    - name: Validate required common variables
      ansible.builtin.assert:
        that:
          - ocp_version | length > 0
          - cluster_type in ['sno', 'ha', 'compact']
          - platform in ['aws', 'azure', 'gcp']
          - provisioner in ['ipi', 'upi']
          - cluster_name | length > 0
        fail_msg: >-
          Provide ocp_version, cluster_type (sno|ha|compact), platform (aws|azure|gcp),
          provisioner (ipi|upi), and cluster_name.

    - name: Resolve cluster work directory
      ansible.builtin.set_fact:
        cluster_dir: "{{ cluster_dir if (cluster_dir | default('') | length > 0) else ((playbook_dir + '/../clusters/' + cluster_name) | expanduser) }}"

    - name: Announce lifecycle action
      ansible.builtin.debug:
        msg: "Running ocp_lifecycle={{ ocp_lifecycle }} for cluster={{ cluster_name }} dir={{ cluster_dir }}"

  roles:
    - role: common_os_detect
    - role: openshift_installer
    - role: cluster_config

  tasks:
    - name: Fail if UPI is requested (roadmap)
      ansible.builtin.include_role:
        name: provisioner_upi
      when: provisioner == 'upi'

    - name: Include AWS platform tasks
      ansible.builtin.include_role:
        name: platform_aws
      when: platform == 'aws' and provisioner == 'ipi'

    - name: Include Azure platform tasks (stub)
      ansible.builtin.include_role:
        name: platform_azure
      when: platform == 'azure'

    - name: Include GCP platform tasks (stub)
      ansible.builtin.include_role:
        name: platform_gcp
      when: platform == 'gcp'

    - name: Run IPI provisioner
      ansible.builtin.include_role:
        name: provisioner_ipi
      when: provisioner == 'ipi' and platform == 'aws'
