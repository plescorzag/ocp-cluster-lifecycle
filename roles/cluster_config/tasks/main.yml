---
- name: Validate cluster_type
  ansible.builtin.assert:
    that:
      - cluster_type in cluster_topology
    fail_msg: "Unknown cluster_type '{{ cluster_type }}'. Use sno, ha, or compact."

- name: Apply topology replicas
  ansible.builtin.set_fact:
    control_plane_replicas: "{{ cluster_topology[cluster_type].control_plane_replicas }}"
    compute_replicas: "{{ cluster_topology[cluster_type].compute_replicas }}"

- name: Expand secret file paths
  ansible.builtin.set_fact:
    pull_secret_file_abs: "{{ pull_secret_file | expanduser }}"
    ssh_public_key_file_abs: "{{ ssh_public_key_file | expanduser }}"

- name: Resolve base_domain from OpenEnv GUID (Azure)
  when:
    - ocp_lifecycle == 'deploy'
    - platform == 'azure'
    - base_domain | default('') | length == 0
  ansible.builtin.set_fact:
    base_domain: >-
      {{
        (
          azure_guid if (azure_guid | default('') | length > 0)
          else (lookup('env', 'GUID') | default('', true))
        ) ~ '.azure.redhatworkshops.io'
      }}

- name: Require pull secret and SSH key for deploy
  when: ocp_lifecycle == 'deploy'
  block:
    - name: Assert credential paths are set
      ansible.builtin.assert:
        that:
          - pull_secret_file | length > 0
          - ssh_public_key_file | length > 0
          - base_domain | length > 0
        fail_msg: >-
          Missing deploy inputs:
          pull_secret_file={{ 'OK' if (pull_secret_file | length > 0) else 'MISSING' }},
          ssh_public_key_file={{ 'OK' if (ssh_public_key_file | length > 0) else 'MISSING' }},
          base_domain={{ 'OK' if (base_domain | length > 0) else 'MISSING' }}.
          For Azure OpenEnv set base_domain: <guid>.azure.redhatworkshops.io
          or export GUID=xxxx (auto-derived as <guid>.azure.redhatworkshops.io).

    - name: Read pull secret
      ansible.builtin.slurp:
        src: "{{ pull_secret_file_abs }}"
      register: _pull_secret_slurp
      no_log: true

    - name: Read SSH public key
      ansible.builtin.slurp:
        src: "{{ ssh_public_key_file_abs }}"
      register: _ssh_key_slurp

    - name: Set secret facts
      ansible.builtin.set_fact:
        # Keep pull secret as base64 so Ansible does not auto-parse JSON into a dict
        pull_secret_b64: "{{ _pull_secret_slurp.content }}"
        ssh_public_key: "{{ _ssh_key_slurp.content | b64decode | trim }}"
      no_log: true

    - name: Reject SSH private keys in ssh_public_key_file
      ansible.builtin.assert:
        that:
          - "'BEGIN OPENSSH PRIVATE KEY' not in ssh_public_key"
          - "'BEGIN RSA PRIVATE KEY' not in ssh_public_key"
          - "'BEGIN EC PRIVATE KEY' not in ssh_public_key"
          - "'BEGIN DSA PRIVATE KEY' not in ssh_public_key"
          - ssh_public_key is regex('^(ssh-(rsa|ed25519|dss)|ecdsa-sha2-nistp[0-9]+)\\s+\\S+')
        fail_msg: >-
          ssh_public_key_file must point to a PUBLIC key (.pub), not a private key.
          Current file: {{ ssh_public_key_file_abs }}
          Expected content like: ssh-ed25519 AAAA... comment  or  ssh-rsa AAAA... comment
          Tip: use ~/.ssh/id_ed25519.pub or ~/.ssh/id_rsa.pub

- name: Ensure cluster work directory exists
  ansible.builtin.file:
    path: "{{ cluster_dir }}"
    state: directory
    mode: "0700"

- name: Show cluster topology
  ansible.builtin.debug:
    msg: >-
      cluster={{ cluster_name }} type={{ cluster_type }}
      controlPlane={{ control_plane_replicas }} compute={{ compute_replicas }}
      dir={{ cluster_dir }}
