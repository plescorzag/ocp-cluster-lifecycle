---
- name: Validate AWS architecture
  ansible.builtin.assert:
    that:
      - aws_architecture in ['x86_64', 'arm64']
      - aws_architecture in aws_instance_types
    fail_msg: "aws_architecture must be 'x86_64' or 'arm64' (got '{{ aws_architecture }}')"

- name: Validate AWS credentials mode
  ansible.builtin.assert:
    that:
      - aws_credentials_mode in ['auto', 'Passthrough', 'Manual', 'Mint']
    fail_msg: "aws_credentials_mode must be auto, Passthrough, Manual, or Mint (got '{{ aws_credentials_mode }}')"

- name: Resolve AWS instance types from architecture
  ansible.builtin.set_fact:
    # install-config uses amd64/arm64; aws_architecture uses x86_64/arm64
    _aws_install_architecture: "{{ 'amd64' if aws_architecture == 'x86_64' else 'arm64' }}"
    _aws_control_plane_type: >-
      {{
        aws_control_plane_instance_type
        if (aws_control_plane_instance_type | default('') | length > 0)
        else aws_instance_types[aws_architecture].control_plane
      }}
    _aws_compute_type: >-
      {{
        aws_compute_instance_type
        if (aws_compute_instance_type | default('') | length > 0)
        else aws_instance_types[aws_architecture].compute
      }}

- name: Validate AWS variables for deploy
  when: ocp_lifecycle == 'deploy'
  ansible.builtin.assert:
    that:
      - aws_region | length > 0
      - base_domain | length > 0
    fail_msg: "AWS deploy requires aws_region and base_domain"

- name: Check AWS credentials (profile or environment)
  when: ocp_lifecycle == 'deploy'
  block:
    - name: Probe AWS identity
      ansible.builtin.command:
        argv: "{{ ['aws', 'sts', 'get-caller-identity'] + (['--profile', aws_profile] if (aws_profile | length > 0) else []) }}"
      register: _aws_identity
      changed_when: false
      failed_when: false

    - name: Assert AWS credentials work
      ansible.builtin.assert:
        that:
          - _aws_identity.rc == 0
        fail_msg: >-
          AWS credentials are not available. Set aws_profile or export
          AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY (and ensure the aws CLI is installed).
          Detail: {{ _aws_identity.stderr | default(_aws_identity.stdout) }}

    # Detect SSO vs static keys so both ~/.aws/credentials (Mint) and SSO (Passthrough) work
    - name: Detect AWS SSO configuration for profile
      when: aws_credentials_mode == 'auto'
      ansible.builtin.shell: |
        set -e
        profile="{{ aws_profile | default('') }}"
        if [ -n "${AWS_PROFILE:-}" ] && [ -z "$profile" ]; then
          profile="$AWS_PROFILE"
        fi
        if [ -n "$profile" ]; then
          if aws configure get sso_start_url --profile "$profile" 2>/dev/null | grep -q .; then
            echo sso
            exit 0
          fi
          if aws configure get sso_session --profile "$profile" 2>/dev/null | grep -q .; then
            echo sso
            exit 0
          fi
          if aws configure get credential_process --profile "$profile" 2>/dev/null | grep -qi 'sso\|login'; then
            echo sso
            exit 0
          fi
        fi
        # LoginProvider / SSO session often exposes a session token without long-lived keys in credentials file
        if aws configure export-credentials {{ '--profile ' ~ aws_profile if (aws_profile | length > 0) else '' }} --format env 2>/dev/null | grep -q '^export AWS_SESSION_TOKEN='; then
          # Prefer credentials file static keys when access key is present in credentials file for this profile
          creds_file="${AWS_SHARED_CREDENTIALS_FILE:-$HOME/.aws/credentials}"
          if [ -n "$profile" ] && [ -f "$creds_file" ] && grep -q "^\[${profile}\]" "$creds_file"; then
            echo static
            exit 0
          fi
          echo sso
          exit 0
        fi
        echo static
      args:
        executable: /bin/bash
      register: _aws_cred_source
      changed_when: false
      failed_when: false

    - name: Resolve effective credentialsMode
      ansible.builtin.set_fact:
        # Empty effective value omits credentialsMode from install-config (= installer Mint default)
        _aws_credentials_mode_effective: >-
          {{
            '' if aws_credentials_mode == 'Mint'
            else (
              aws_credentials_mode if aws_credentials_mode in ['Passthrough', 'Manual']
              else (
                'Passthrough'
                if (aws_credentials_mode == 'auto' and (_aws_cred_source.stdout | default('static') | trim) == 'sso')
                else ''
              )
            )
          }}

    - name: Show selected AWS credentials mode
      ansible.builtin.debug:
        msg: >-
          aws_credentials_mode={{ aws_credentials_mode }}
          detected={{ _aws_cred_source.stdout | default('n/a') | trim }}
          effective={{ _aws_credentials_mode_effective if (_aws_credentials_mode_effective | length > 0) else 'Mint' }}
          (static ~/.aws/credentials or env keys -> Mint;
          AWS SSO / LoginProvider -> Passthrough)

- name: Ensure credentials mode fact exists for destroy path
  when: ocp_lifecycle != 'deploy'
  ansible.builtin.set_fact:
    _aws_credentials_mode_effective: ""

- name: Show selected AWS machine types
  when: ocp_lifecycle == 'deploy'
  ansible.builtin.debug:
    msg: >-
      aws_architecture={{ aws_architecture }}
      install-config architecture={{ _aws_install_architecture }}
      controlPlane={{ _aws_control_plane_type }}
      compute={{ _aws_compute_type }}

- name: Render install-config.yaml for AWS IPI
  when: ocp_lifecycle == 'deploy'
  block:
    - name: Remove stale install-config before rendering
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cluster_dir }}/install-config.yaml"
        - "{{ cluster_dir }}/install-config.yaml.backup"

    - name: Render install-config.yaml
      ansible.builtin.template:
        src: install-config.yaml.j2
        dest: "{{ cluster_dir }}/install-config.yaml"
        mode: "0600"

    - name: Validate install-config.yaml parses as YAML
      ansible.builtin.slurp:
        src: "{{ cluster_dir }}/install-config.yaml"
      register: _install_config_slurp
      no_log: true

    - name: Parse install-config.yaml
      ansible.builtin.set_fact:
        _install_config_parsed: "{{ _install_config_slurp.content | b64decode | from_yaml }}"
      no_log: true

    - name: Assert required install-config string fields
      ansible.builtin.assert:
        that:
          - _install_config_parsed.pullSecret is string
          - _install_config_parsed.sshKey is string
          - _install_config_parsed.sshKey | length > 0
        fail_msg: >-
          install-config.yaml is invalid after render (pullSecret/sshKey must be strings).
          Check ssh_public_key_file and pull_secret_file contents.

- name: Confirm metadata.json exists for destroy
  when: ocp_lifecycle == 'destroy'
  ansible.builtin.stat:
    path: "{{ cluster_dir }}/metadata.json"
  register: _aws_metadata

- name: Fail destroy without metadata
  when: ocp_lifecycle == 'destroy' and not _aws_metadata.stat.exists
  ansible.builtin.fail:
    msg: >-
      Cannot destroy: {{ cluster_dir }}/metadata.json not found.
      Point cluster_dir (or cluster_name) at the directory used during deploy.
