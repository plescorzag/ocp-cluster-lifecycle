---
- name: Require ocp_version and OS detection facts
  ansible.builtin.assert:
    that:
      - ocp_version | length > 0
      - installer_os is defined
      - installer_arch is defined
    fail_msg: "ocp_version and OS detection facts are required"

- name: Resolve cluster architecture for installer download
  ansible.builtin.set_fact:
    _cluster_architecture: "{{ cluster_architecture | default(aws_architecture | default('x86_64')) }}"

- name: Validate cluster architecture
  ansible.builtin.assert:
    that:
      - _cluster_architecture in ['x86_64', 'arm64']
    fail_msg: "cluster_architecture must be 'x86_64' or 'arm64' (got '{{ _cluster_architecture }}')"

# Client downloads follow the *cluster* architecture, not the Mac/Linux host CPU.
# For x86_64 clusters that means:
#   https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp/<version>/
- name: Map mirror clients path from cluster architecture
  ansible.builtin.set_fact:
    _mirror_arch: "{{ 'x86_64' if _cluster_architecture == 'x86_64' else 'aarch64' }}"

- name: Resolve installer archive name for host OS + cluster architecture
  ansible.builtin.set_fact:
    _installer_archive: >-
      {{
        'openshift-install-windows.zip' if installer_os == 'windows'
        else (
          'openshift-install-mac-' ~ ocp_version ~ '.tar.gz'
          if (installer_os == 'mac' and _cluster_architecture == 'x86_64')
          else (
            'openshift-install-mac-arm64-' ~ ocp_version ~ '.tar.gz'
            if (installer_os == 'mac' and _cluster_architecture == 'arm64')
            else (
              'openshift-install-linux-' ~ ocp_version ~ '.tar.gz'
              if (installer_os == 'linux' and _cluster_architecture == 'x86_64')
              else (
                'openshift-install-linux-arm64-' ~ ocp_version ~ '.tar.gz'
                if (installer_os == 'linux' and _cluster_architecture == 'arm64')
                else 'openshift-install-linux.tar.gz'
              )
            )
          )
        )
      }}
    _installer_binary_name: "{{ 'openshift-install.exe' if installer_os == 'windows' else 'openshift-install' }}"
    _installer_version_dir: "{{ installer_cache_dir }}/{{ ocp_version }}/{{ installer_os }}-client-{{ _cluster_architecture }}"

- name: Set openshift-install binary path and download URL
  ansible.builtin.set_fact:
    openshift_install_bin: "{{ _installer_version_dir }}/{{ _installer_binary_name }}"
    _installer_url: >-
      {{ openshift_mirror_base }}/{{ _mirror_arch }}/clients/ocp/{{ ocp_version }}/{{ _installer_archive }}

- name: Ensure installer cache directory exists
  ansible.builtin.file:
    path: "{{ _installer_version_dir }}"
    state: directory
    mode: "0755"

- name: Check for cached openshift-install
  ansible.builtin.stat:
    path: "{{ openshift_install_bin }}"
  register: _installer_stat

- name: Show installer download source
  ansible.builtin.debug:
    msg: >-
      cluster_architecture={{ _cluster_architecture }}
      mirror={{ _mirror_arch }}/clients/ocp/{{ ocp_version }}/
      archive={{ _installer_archive }}
      url={{ _installer_url }}
      cached={{ _installer_stat.stat.exists }}

- name: Download openshift-install archive
  when: not _installer_stat.stat.exists
  block:
    - name: Fetch installer archive
      ansible.builtin.get_url:
        url: "{{ _installer_url }}"
        dest: "{{ _installer_version_dir }}/{{ _installer_archive }}"
        mode: "0644"
      retries: 3
      delay: 5

    # Use system tar/unzip — ansible.builtin.unarchive requires GNU tar,
    # which macOS (BSD tar) does not provide by default.
    - name: Extract tar.gz installer (linux/mac)
      ansible.builtin.command:
        argv:
          - tar
          - -xzf
          - "{{ _installer_version_dir }}/{{ _installer_archive }}"
          - -C
          - "{{ _installer_version_dir }}"
      args:
        creates: "{{ openshift_install_bin }}"
      when: installer_os != 'windows'

    - name: Extract zip installer (windows)
      ansible.builtin.command:
        argv:
          - unzip
          - -o
          - "{{ _installer_version_dir }}/{{ _installer_archive }}"
          - -d
          - "{{ _installer_version_dir }}"
      args:
        creates: "{{ openshift_install_bin }}"
      when: installer_os == 'windows'

    - name: Ensure installer is executable
      ansible.builtin.file:
        path: "{{ openshift_install_bin }}"
        mode: "0755"
      when: installer_os != 'windows'

# x86_64 mac binary on Apple Silicon needs Rosetta (arch -x86_64)
- name: Build openshift-install command prefix
  ansible.builtin.set_fact:
    openshift_install_cmd: >-
      {{
        ['arch', '-x86_64', openshift_install_bin]
        if (installer_os == 'mac' and installer_arch == 'arm64' and _cluster_architecture == 'x86_64')
        else [openshift_install_bin]
      }}

- name: Verify openshift-install binary
  ansible.builtin.command:
    argv: "{{ openshift_install_cmd + ['version'] }}"
  register: _installer_version
  changed_when: false

- name: Show installer version
  ansible.builtin.debug:
    msg: "{{ _installer_version.stdout_lines | default([_installer_version.stdout]) }}"
