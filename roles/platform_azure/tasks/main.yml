---
- name: Resolve cluster architecture for Azure
  ansible.builtin.set_fact:
    _cluster_architecture: "{{ cluster_architecture | default(aws_architecture | default('x86_64')) }}"

- name: Validate Azure architecture
  ansible.builtin.assert:
    that:
      - _cluster_architecture in ['x86_64', 'arm64']
      - _cluster_architecture in azure_instance_types
    fail_msg: "cluster_architecture must be 'x86_64' or 'arm64' (got '{{ _cluster_architecture }}')"

- name: Resolve Azure credentials from vars or environment
  ansible.builtin.set_fact:
    _azure_client_id: "{{ azure_client_id if (azure_client_id | default('') | length > 0) else (lookup('env', 'CLIENT_ID') | default(lookup('env', 'AZURE_CLIENT_ID'), true) | default('', true)) }}"
    _azure_client_secret: "{{ azure_client_secret if (azure_client_secret | default('') | length > 0) else (lookup('env', 'PASSWORD') | default(lookup('env', 'AZURE_CLIENT_SECRET'), true) | default('', true)) }}"
    _azure_tenant_id: "{{ azure_tenant_id if (azure_tenant_id | default('') | length > 0) else (lookup('env', 'TENANT') | default(lookup('env', 'AZURE_TENANT_ID'), true) | default('', true)) }}"
    _azure_subscription_id: "{{ azure_subscription_id if (azure_subscription_id | default('') | length > 0) else (lookup('env', 'SUBSCRIPTION') | default(lookup('env', 'AZURE_SUBSCRIPTION_ID'), true) | default('', true)) }}"
    _azure_resource_group: >-
      {{
        azure_resource_group if (azure_resource_group | default('') | length > 0)
        else (
          lookup('env', 'RESOURCEGROUP') | default(lookup('env', 'RESOURCE_GROUP'), true)
          | default(lookup('env', 'AZURE_RESOURCE_GROUP'), true)
          | default('', true)
        )
      }}
    _azure_guid: "{{ azure_guid if (azure_guid | default('') | length > 0) else (lookup('env', 'GUID') | default('', true)) }}"
  no_log: true

- name: Resolve Azure resource group names
  ansible.builtin.set_fact:
    # DNS zone RG (may be in a different region than azure_region — that is OK)
    _azure_base_domain_rg: "{{ (azure_base_domain_resource_group | default('') | length > 0) | ternary(azure_base_domain_resource_group, _azure_resource_group) | trim }}"
    # Cluster RG: leave empty by default so openshift-install creates a new empty RG
    # in azure_region. Do NOT reuse the OpenEnv/DNS RG (it is non-empty and may be
    # in another region — installer rejects that).
    _azure_cluster_rg: "{{ azure_cluster_resource_group | default('') | trim }}"

- name: Resolve Azure VM sizes and install architecture
  ansible.builtin.set_fact:
    _azure_install_architecture: "{{ 'amd64' if _cluster_architecture == 'x86_64' else 'arm64' }}"
    _azure_control_plane_type: >-
      {{
        azure_control_plane_instance_type
        if (azure_control_plane_instance_type | default('') | length > 0)
        else azure_instance_types[_cluster_architecture].control_plane
      }}
    _azure_compute_type: >-
      {{
        azure_compute_instance_type
        if (azure_compute_instance_type | default('') | length > 0)
        else azure_instance_types[_cluster_architecture].compute
      }}

- name: Validate Azure variables for deploy
  when: ocp_lifecycle == 'deploy'
  ansible.builtin.assert:
    that:
      - azure_region | length > 0
      - base_domain | length > 0
      - _azure_client_id | length > 0
      - _azure_client_secret | length > 0
      - _azure_tenant_id | length > 0
      - _azure_subscription_id | length > 0
      - _azure_base_domain_rg | length > 0
    fail_msg: >-
      Missing Azure deploy inputs (set vars or export env in the SAME shell as ansible-playbook):
      azure_region={{ 'OK' if (azure_region | length > 0) else 'MISSING' }},
      base_domain={{ 'OK' if (base_domain | length > 0) else 'MISSING' }},
      client_id={{ 'OK' if (_azure_client_id | length > 0) else 'MISSING (CLIENT_ID / azure_client_id)' }},
      client_secret={{ 'OK' if (_azure_client_secret | length > 0) else 'MISSING (PASSWORD / azure_client_secret)' }},
      tenant={{ 'OK' if (_azure_tenant_id | length > 0) else 'MISSING (TENANT / azure_tenant_id)' }},
      subscription={{ 'OK' if (_azure_subscription_id | length > 0) else 'MISSING (SUBSCRIPTION / azure_subscription_id)' }},
      resource_group={{ 'OK' if (_azure_base_domain_rg | length > 0) else 'MISSING (RESOURCEGROUP / azure_resource_group)' }}.
      Tip: add azure_resource_group: openenv-<guid> to vars/my-azure.yml, or:
      export RESOURCEGROUP=openenv-<guid>

- name: Show selected Azure machine settings
  when: ocp_lifecycle == 'deploy'
  ansible.builtin.debug:
    msg: >-
      azure_region={{ azure_region }}
      architecture={{ _azure_install_architecture }}
      controlPlane={{ _azure_control_plane_type }}
      compute={{ _azure_compute_type }}
      baseDomainRG={{ _azure_base_domain_rg }} (DNS zone; region may differ)
      clusterRG={{ _azure_cluster_rg if (_azure_cluster_rg | length > 0) else '(installer creates new empty RG in azure_region)' }}
      guid={{ _azure_guid | default('') }}

- name: Prepare Azure service principal auth for openshift-install
  when: ocp_lifecycle in ['deploy', 'destroy']
  block:
    - name: Ensure Azure auth directory exists
      ansible.builtin.file:
        path: "{{ cluster_dir }}/.azure"
        state: directory
        mode: "0700"

    - name: Write osServicePrincipal.json for installer
      when: >-
        (_azure_client_id | default('') | length > 0) and
        (_azure_client_secret | default('') | length > 0) and
        (_azure_tenant_id | default('') | length > 0) and
        (_azure_subscription_id | default('') | length > 0)
      ansible.builtin.copy:
        dest: "{{ cluster_dir }}/.azure/osServicePrincipal.json"
        mode: "0600"
        content: |
          {
            "subscriptionId": "{{ _azure_subscription_id }}",
            "clientId": "{{ _azure_client_id }}",
            "clientSecret": "{{ _azure_client_secret }}",
            "tenantId": "{{ _azure_tenant_id }}"
          }
      no_log: true

    - name: Export AZURE_AUTH_LOCATION for provisioner
      ansible.builtin.set_fact:
        azure_auth_location: "{{ cluster_dir }}/.azure/osServicePrincipal.json"

- name: Preflight check DNS resource group and zone (deploy)
  when: ocp_lifecycle == 'deploy'
  block:
    - name: Check az CLI is available
      ansible.builtin.command:
        argv: [az, version]
      register: _az_version
      changed_when: false
      failed_when: false

    - name: Fail if az CLI missing
      when: _az_version.rc != 0
      ansible.builtin.fail:
        msg: >-
          Azure CLI (az) is required for DNS preflight checks.
          Install it, then re-run deploy.

    - name: Login with service principal for preflight
      ansible.builtin.command:
        argv:
          - az
          - login
          - --service-principal
          - -u
          - "{{ _azure_client_id }}"
          - -p
          - "{{ _azure_client_secret }}"
          - --tenant
          - "{{ _azure_tenant_id }}"
          - --output
          - none
      no_log: true
      changed_when: false

    - name: Set subscription for preflight
      ansible.builtin.command:
        argv:
          - az
          - account
          - set
          - --subscription
          - "{{ _azure_subscription_id }}"
      changed_when: false

    - name: Verify base domain resource group exists
      ansible.builtin.command:
        argv:
          - az
          - group
          - show
          - --name
          - "{{ _azure_base_domain_rg }}"
          - --query
          - "{name:name,location:location}"
          - -o
          - json
      register: _azure_rg_show
      changed_when: false
      failed_when: false

    - name: Fail if base domain resource group is missing
      when: _azure_rg_show.rc != 0
      ansible.builtin.fail:
        msg: >-
          baseDomainResourceGroupName '{{ _azure_base_domain_rg }}' was not found
          in subscription {{ _azure_subscription_id }} (ResourceGroupNotFound).
          OpenEnv sandboxes expire; confirm the RG still exists and the SP can read it:
            az group show -n {{ _azure_base_domain_rg }} --subscription {{ _azure_subscription_id }}
          Detail: {{ _azure_rg_show.stderr | default(_azure_rg_show.stdout) }}

    - name: Verify public DNS zone exists for base_domain
      ansible.builtin.command:
        argv:
          - az
          - network
          - dns
          - zone
          - show
          - --resource-group
          - "{{ _azure_base_domain_rg }}"
          - --name
          - "{{ base_domain }}"
          - --query
          - name
          - -o
          - tsv
      register: _azure_dns_zone
      changed_when: false
      failed_when: false

    - name: List DNS zones in base domain resource group
      when: _azure_dns_zone.rc != 0
      ansible.builtin.command:
        argv:
          - az
          - network
          - dns
          - zone
          - list
          - --resource-group
          - "{{ _azure_base_domain_rg }}"
          - --query
          - "[].name"
          - -o
          - tsv
      register: _azure_dns_zones_list
      changed_when: false
      failed_when: false

    - name: Fail if DNS zone is missing
      when: _azure_dns_zone.rc != 0
      ansible.builtin.fail:
        msg: >-
          DNS zone '{{ base_domain }}' was not found in resource group
          '{{ _azure_base_domain_rg }}'.
          Zones present in that RG: {{
            (_azure_dns_zones_list.stdout_lines | default([])) | join(', ')
            if (_azure_dns_zones_list.rc | default(1) == 0 and (_azure_dns_zones_list.stdout_lines | default([]) | length > 0))
            else '(none found — check GUID/RESOURCEGROUP)'
          }}.
          Update base_domain in your vars file to match the zone name
          (for OpenEnv this is usually <guid>.azure.redhatworkshops.io).
          Detail: {{ _azure_dns_zone.stderr | default(_azure_dns_zone.stdout) }}

    - name: Show DNS preflight OK
      ansible.builtin.debug:
        msg: >-
          DNS preflight OK: RG={{ _azure_base_domain_rg }}
          ({{ (_azure_rg_show.stdout | from_json).location }})
          zone={{ base_domain }}

- name: Render install-config.yaml for Azure IPI
  when: ocp_lifecycle == 'deploy'
  block:
    - name: Remove stale install-config before rendering
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ cluster_dir }}/install-config.yaml"
        - "{{ cluster_dir }}/install-config.yaml.backup"

    - name: Render install-config.yaml
      ansible.builtin.template:
        src: install-config.yaml.j2
        dest: "{{ cluster_dir }}/install-config.yaml"
        mode: "0600"

    - name: Validate install-config.yaml parses as YAML
      ansible.builtin.slurp:
        src: "{{ cluster_dir }}/install-config.yaml"
      register: _azure_install_config_slurp
      no_log: true

    - name: Parse install-config.yaml
      ansible.builtin.set_fact:
        _azure_install_config_parsed: "{{ _azure_install_config_slurp.content | b64decode | from_yaml }}"
      no_log: true

    - name: Assert required install-config string fields
      ansible.builtin.assert:
        that:
          - _azure_install_config_parsed.pullSecret is string
          - _azure_install_config_parsed.sshKey is string
          - _azure_install_config_parsed.platform.azure.baseDomainResourceGroupName | length > 0
        fail_msg: "Azure install-config.yaml is invalid after render."

- name: Confirm metadata.json exists for destroy
  when: ocp_lifecycle == 'destroy'
  ansible.builtin.stat:
    path: "{{ cluster_dir }}/metadata.json"
  register: _azure_metadata

- name: Fail destroy without metadata
  when: ocp_lifecycle == 'destroy' and not _azure_metadata.stat.exists
  ansible.builtin.fail:
    msg: >-
      Cannot destroy: {{ cluster_dir }}/metadata.json not found.
      Point cluster_dir (or cluster_name) at the directory used during deploy.
